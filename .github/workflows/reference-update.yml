name: Qualify upstream API reference

on:
  schedule:
    - cron: '23 9 * * 2'
  workflow_dispatch:
    inputs:
      tag:
        description: Official 8.3 channel or explicit 8.3.patch tag
        type: string
        required: true
        default: '8.3'

permissions:
  contents: read

concurrency:
  group: igw-reference-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify (${{ matrix.profile }})
    # Dedicated, provisioned runner only; never execute PR code on this host.
    if: >-
      vars.IGW_REFERENCE_RUNNER_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, X64, igw-reference]
    timeout-minutes: 120
    strategy:
      # A failed profile cancels queued work; Gateway loads never overlap.
      fail-fast: true
      max-parallel: 1
      matrix:
        profile: [image-defaults, core-opcua]
    env:
      REFERENCE_TAG: ${{ inputs.tag || '8.3' }}
      REFERENCE_PROFILE: ${{ matrix.profile }}
      # Outside the checkout so the next profile's clean checkout preserves it.
      REFERENCE_OUT: ${{ github.workspace }}/../igw-private-reference-evidence/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Qualify resolved upstream image
        run: |
          umask 077
          set -o noclobber
          mkdir -p -- "$(dirname "$REFERENCE_OUT")"
          if python3 scripts/update-reference.py --tag "$REFERENCE_TAG" --module-profile "$REFERENCE_PROFILE" --out "$REFERENCE_OUT" --require-clean > "$REFERENCE_OUT.console.log" 2>&1; then
            echo "Qualification completed."
          else
            code=$?
            echo "::error::Qualification failed; inspect the private runner evidence."
            exit "$code"
          fi

      - name: Retain public qualification status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ignition-reference-status-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ env.REFERENCE_OUT }}/public-run.json

      - name: Retain qualified API reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ignition-reference-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.REFERENCE_OUT }}/reference/reference.json
            ${{ env.REFERENCE_OUT }}/reference/openapi.json.gz

  status:
    name: Reference update status
    needs: qualify
    if: >-
      always() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Report qualification and last success
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_RUNNER_ENABLED: ${{ vars.IGW_REFERENCE_RUNNER_ENABLED == 'true' && 'true' || 'false' }}
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
        run: >-
          python3 scripts/reference-status.py
          --runner-enabled "$REFERENCE_RUNNER_ENABLED"
          --current-run "$GITHUB_RUN_ID"
          --qualification-result "$QUALIFICATION_RESULT"
